name: Build APK and EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: read

jobs:
  detect-project:
    name: Detect project type
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Detect build files
        id: detect
        shell: bash
        run: |
          if [ -f gradlew ]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f main.py ]; then echo "python=true" >> "$GITHUB_OUTPUT"; else echo "python=false" >> "$GITHUB_OUTPUT"; fi

  android-apk:
    name: Build Android APK
    needs: detect-project
    if: ${{ needs.detect-project.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7

  windows-exe:
    name: Build Windows EXE (Python)
    needs: detect-project
    if: ${{ needs.detect-project.outputs.python == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --clean --noconfirm --onefile --name app main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/app.exe
          if-no-files-found: error
          retention-days: 7

  no-project-detected:
    name: Explain expected project files
    needs: detect-project
    if: ${{ needs.detect-project.outputs.android != 'true' && needs.detect-project.outputs.python != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "No supported project entrypoint was found."
          echo "For Android, add a Gradle project with a gradlew file at repository root."
          echo "For Python EXE, add main.py at repository root and optionally requirements.txt."
          echo "Web projects need a separate packaging setup (for example Capacitor for APK or Electron for EXE)."
