name: Keep Render service awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 https://ozal-telegram-agent.onrender.com/ || curl --fail --silent --show-error --max-time 20 https://ozal-telegram-agent.onrender.com/
